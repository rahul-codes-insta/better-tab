<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Wallpaper, clock, then the mountain cut-out on top so the clock sits behind the peaks -->
  <img class="wall" id="wallBg" alt="" draggable="false">
  <div class="sky-shade"></div>

  <section class="time" aria-live="off">
    <div class="date" id="date">
      <span id="dateText"></span>
      <span class="weather" id="weather" hidden>
        <span class="wx-sep" aria-hidden="true"></span>
        <span class="wx-icon" id="wxIcon"></span>
        <span class="wx-temp" id="wxTemp"></span>
      </span>
    </div>
    <div class="clock" id="clock"></div>
  </section>

  <img class="wall wall-fg" id="wallFg" alt="" draggable="false">
  <div class="night-shade"></div>

  <!-- Floating widgets (above the wallpaper, below the bar and settings) -->
  <div class="widget-layer" id="widgetLayer"></div>

  <header class="topbar">
    <nav class="profiles" id="profiles" aria-label="Mode"></nav>
    <button class="round-btn" id="widgetsBtn" title="Show widgets" aria-label="Show widgets" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></svg>
    </button>
    <button class="round-btn" id="nightBtn" title="Night mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a.7.7 0 0 0-.9-.9A9.9 9.9 0 1 0 21.1 15.5a.7.7 0 0 0-.9-.9Z"/></svg>
    </button>
  </header>

  <footer class="dock-wrap">
   <div class="dock-stack" id="dockStack">
    <!-- Search: apps + the web -->
    <div class="search" id="search"></div>
    <!-- Keep watching (Prime Video), aligned to the bar's left edge -->
    <section class="continue" id="continue" hidden aria-label="Keep watching">
      <div class="continue-label">Keep watching</div>
      <div class="continue-row" id="continueRow"></div>
    </section>
    <div class="dock" id="dock">
      <!-- Drawer: expands upward out of the bar (drawer mode only) -->
      <div class="drawer" id="drawer" inert>
        <div class="drawer-inner">
          <div class="drawer-head">
            <span id="drawerTitle">All apps</span>
            <span class="drawer-count" id="drawerCount"></span>
          </div>
          <div class="drawer-grid" id="drawerGrid" role="list"></div>
        </div>
      </div>
      <div class="bar-row">
        <button class="dock-arrow left" id="arrowL" aria-label="Scroll left" tabindex="-1">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="track" id="track" role="list"></div>
        <button class="dock-arrow right" id="arrowR" aria-label="Scroll right" tabindex="-1">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
        <div class="dock-fixed">
          <button class="tile util" id="settingsBtn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z" stroke-linejoin="round"/></g></svg>
          </button>
          <button class="tile util" id="addBtn" title="Add an app" aria-label="Add an app">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
    </div>
   </div>
    <div class="tip" id="tip" role="status"></div>
  </footer>

  <!-- Right-click menu -->
  <div class="menu" id="menu" role="menu" hidden>
    <button role="menuitem" data-act="open-new">Open in new tab</button>
    <button role="menuitem" data-act="edit">Edit…</button>
    <button role="menuitem" data-act="refetch">Refresh icon</button>
    <button role="menuitem" data-act="left">Move left</button>
    <button role="menuitem" data-act="right">Move right</button>
    <button role="menuitem" data-act="swap-mode">Move to Work</button>
    <hr>
    <button role="menuitem" data-act="remove" class="danger">Remove</button>
  </div>

  <!-- Add / edit app -->
  <dialog class="sheet" id="appDialog">
    <form method="dialog" id="appForm" autocomplete="off">
      <h2 id="appTitle">Add an app</h2>
      <div class="app-preview">
        <div class="preview-icon" id="previewIcon"><span class="spinner" hidden></span></div>
        <div class="preview-meta">
          <div class="preview-name" id="previewName">New app</div>
          <div class="preview-src" id="previewSrc">Paste a link to find its icon</div>
        </div>
      </div>
      <label>Link<input id="appUrl" type="text" inputmode="url" placeholder="netflix.com" required></label>
      <label>Name<input id="appName" type="text" maxlength="28" placeholder="Netflix"></label>
      <details class="icon-opts">
        <summary>Change icon</summary>
        <div class="icon-row">
          <input id="iconUrl" type="text" inputmode="url" placeholder="Paste an image link">
          <button type="button" class="btn ghost" id="iconUrlBtn">Use</button>
        </div>
        <div class="icon-row">
          <label class="btn ghost file-btn">Upload image<input id="iconFile" type="file" accept="image/*" hidden></label>
          <button type="button" class="btn ghost" id="iconAutoBtn">Find automatically</button>
        </div>
      </details>
      <p class="form-error" id="appError" hidden></p>
      <div class="actions">
        <button type="button" class="btn danger-ghost" id="appRemove" hidden>Remove</button>
        <span class="grow"></span>
        <button type="button" class="btn ghost" value="cancel" id="appCancel">Cancel</button>
        <button type="submit" class="btn primary" id="appSave">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog class="settings" id="settingsDialog" aria-label="Settings">
    <div class="sp-head">
      <h2>Settings <span class="sp-mode" id="spMode" hidden></span></h2>
      <label class="adv-mini" title="Show advanced settings">
        <span>Advanced</span>
        <input type="checkbox" class="toggle" id="showAdvanced">
      </label>
      <button type="button" class="sp-close" id="settingsClose" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sp-body" id="settingsBody"></div>
  </dialog>

  <!-- + menu: add apps or widgets -->
  <dialog class="add-sheet" id="addSheet" aria-label="Add to your new tab">
    <div class="as-head">
      <div class="s-seg as-tabs" id="addTabs" role="tablist">
        <button type="button" role="tab" data-tab="apps" aria-checked="true">Apps</button>
        <button type="button" role="tab" data-tab="widgets" aria-checked="false">Widgets</button>
      </div>
      <button type="button" class="sp-close" id="addClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="as-pane" data-pane="apps">
      <div class="as-row">
        <div class="as-title" id="popTitle">Popular apps</div>
        <div class="s-seg as-chips" id="popSets"></div>
      </div>
      <div class="pop-grid" id="popGrid"></div>
      <form class="as-own" id="asAdd" autocomplete="off">
        <div class="as-own-head">Add a link</div>
        <div class="as-own-row">
          <button type="button" class="as-own-icon" id="asAddIcon" title="Add an image" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9.5" r="1.5" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4.5 16l4.2-3.6 2.8 2.2L15.5 11l4 4.2"/></svg>
          </button>
          <input id="asUrl" type="text" inputmode="url" placeholder="Add Website Link Here" aria-label="Add Website Link Here">
          <input id="asName" type="text" maxlength="28" placeholder="Name" aria-label="Name">
          <button type="submit" class="btn sm primary" id="asAddBtn" disabled>Add</button>
        </div>
        <p class="as-own-note" id="asAddNote"></p>
        <input id="asIconFile" type="file" accept="image/*" hidden>
        <div class="menu as-icon-menu" id="asIconMenu" role="menu" hidden>
          <button type="button" role="menuitem" id="asIconFileBtn">Choose from files</button>
          <button type="button" role="menuitem" id="asIconLink">Use a link</button>
          <div class="as-icon-url" id="asIconUrlRow" hidden>
            <input id="asIconUrl" type="text" inputmode="url" placeholder="Image link" aria-label="Image link">
            <button type="button" id="asIconUrlBtn">Use</button>
          </div>
        </div>
      </form>
    </div>
    <div class="as-pane" data-pane="widgets" hidden>
      <div class="as-title">Add a widget</div>
      <p class="as-sub">Drag a widget by its top bar to move it, and right-click it for its settings.</p>
      <div class="widget-cards" id="widgetCards"></div>
    </div>
  </dialog>

  <!-- 3D Wallpaper Engine, opened as an overlay -->
  <div class="engine-overlay" id="engineOverlay" hidden>
    <iframe id="engineFrame" title="3D Wallpaper Engine"></iframe>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
